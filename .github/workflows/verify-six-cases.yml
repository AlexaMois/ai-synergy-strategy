name: Verify six redesigned cases

on:
  push:
    branches:
      - design/case-library-unified-20261019

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Full production build
        run: npm run build
      - uses: oven-sh/setup-bun@v2
      - name: Catalog tests
        run: bun test tests/case-studies.test.ts
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Browser audit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/six-cases-preview.log 2>&1 &
          for x in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 2; done
          mkdir -p artifacts
          node --input-type=module <<'BROWSER'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const base='http://127.0.0.1:4173';
          const routes=[
            'production-doc-search','caregiver-matching','business-travel',
            'aktransservice','kraypotrebsoyuz','cargo-express'
          ];
          const errors=[];
          const results=[];
          const ok=(cond,message)=>{if(!cond)throw Error(message)};
          for(const [view,width,height] of [['desktop',1440,900],['mobile',390,844]]){
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            for(const slug of routes){
              const page=await context.newPage();
              page.setDefaultTimeout(5500);
              console.log('PAGE_START',view,slug);
              const jsErrors=[]; page.on('pageerror',e=>jsErrors.push(e.message));
              const response=await page.goto(base+'/cases/'+slug,{waitUntil:'domcontentloaded'});
              ok(response && response.ok(),slug+' HTTP failure');
              await page.locator('main h1').first().waitFor({timeout:15000});
              const consent=page.getByRole('dialog',{name:'Помогите сделать сайт полезнее'});
              if(await consent.isVisible()) await consent.getByRole('button',{name:'Продолжить без аналитики'}).click();
              const h1=await page.locator('main h1').first().innerText();
              const measures=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,docHeight:document.documentElement.scrollHeight,form:!!document.getElementById('contact')}));
              ok(measures.overflow<=2,view+' '+slug+' horizontal overflow '+measures.overflow);
              ok(measures.form,view+' '+slug+' contact form absent');
              ok(jsErrors.length===0,view+' '+slug+' JS errors '+jsErrors.join(';'));
              const images=await page.locator('main img').evaluateAll(async nodes=>{
                await Promise.all(nodes.map(x=>x.decode().catch(()=>{})));
                return nodes.map(x=>({alt:x.alt,loaded:x.naturalWidth>0,width:x.naturalWidth}));
              });
              ok(images.every(x=>x.loaded),view+' '+slug+' broken images '+JSON.stringify(images));
              const navLinks=page.locator('nav[aria-label="Разделы проекта"] a');
              const navCount=await navLinks.count();
              if(['aktransservice','kraypotrebsoyuz','cargo-express'].includes(slug)){
                ok(navCount===4,view+' '+slug+' missing quick navigation');
                const href=await navLinks.nth(1).getAttribute('href');
                await navLinks.nth(1).click();
                ok(new URL(page.url()).hash===href,view+' '+slug+' nav hash mismatch');
                ok(await page.locator(href).count()===1,view+' '+slug+' missing anchored section');
              } else {
                ok(navCount===0,view+' '+slug+' unexpected long-story nav');
                ok(await page.locator('section[aria-label="Основное о проекте"] article').count()===3,view+' '+slug+' summary cards absent');
              }
              const short=slug==='production-doc-search'||slug==='caregiver-matching'||slug==='business-travel';
              await page.screenshot({path:'artifacts/'+view+'-'+slug+(short?'-full':'-top')+'.png',fullPage:short,animations:'disabled'});
              const cta=page.getByRole('button',{name:'Обсудить похожую задачу'}).last();
              ok(await cta.count()>0,view+' '+slug+' CTA absent');
              await cta.click();
              await page.waitForTimeout(800);
              const contactTop=await page.locator('#contact').evaluate(x=>Math.round(x.getBoundingClientRect().top));
              ok(contactTop<height+100&&contactTop>-height,view+' '+slug+' CTA scroll failed: '+contactTop);
              results.push({view,slug,h1,...measures,navCount,images:images.length,contactTop,jsErrors});
              console.log('PAGE_OK',view,slug);
              await page.close();
            }
            await context.close();
          }
          const refs=await browser.newPage();
          for(const route of ['/','/start','/about','/cases','/cases/neurotenderolog']){
            const response=await refs.goto(base+route,{waitUntil:'domcontentloaded'});
            ok(response && response.ok(),'reference route failed '+route);
            ok((await refs.locator('body').innerText()).length>160,'blank reference '+route);
          }
          await browser.close();
          fs.writeFileSync('artifacts/audit.json',JSON.stringify(results,null,2));
          console.log('AUDIT='+JSON.stringify(results));
          BROWSER
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-cases-screenshots
          path: artifacts/
          if-no-files-found: ignore

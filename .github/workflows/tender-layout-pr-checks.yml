name: Tender case visual checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/cases/NeuroTenderologContent.tsx'
      - 'tests/neurotender-layout.browser.mjs'
      - '.github/workflows/tender-layout-pr-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx eslint src/pages/cases/NeuroTenderologContent.tsx
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/tender-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8080/cases/neurotenderolog > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tender-vite.log
          exit 1
      - name: Browser checks
        run: node tests/neurotender-layout.browser.mjs

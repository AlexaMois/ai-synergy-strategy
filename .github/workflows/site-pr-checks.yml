name: Site PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-pr-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Isolated CI preview only: no production API credentials or live lead submissions.
      VITE_FORMS_BASE_URL: https://forms.ci.invalid
      VITE_SUPABASE_URL: https://supabase.ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-preview-placeholder
      VITE_SUPABASE_PROJECT_ID: ci-preview
      TEST_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Match the existing deploy.yml installation strategy until the lockfile is repaired.
      - name: Install dependencies (same as deployment)
        id: install
        run: npm install --no-audit --no-fund
      - name: Report package lock drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::warning::package-lock.json differs after npm install; synchronize separately before switching to npm ci."
            mkdir -p artifacts/site-pr
            git diff -- package-lock.json > artifacts/site-pr/package-lock-drift.patch
          fi
      - name: Build production preview
        id: build
        run: npm run build
      - name: TypeScript application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --no-install tsc --noEmit -p tsconfig.app.json
      - name: TypeScript build configuration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --no-install tsc --noEmit -p tsconfig.node.json
      - name: Normalize generated MCP bundle for lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # Normalize only the disposable generated CI copy, then lint the entire repository.
          grep -q '^// AUTO-GENERATED by @lovable.dev/mcp-js' supabase/functions/mcp/index.ts
          npx --no-install eslint --fix supabase/functions/mcp/index.ts
          mkdir -p artifacts/site-pr
          git diff -- supabase/functions/mcp/index.ts > artifacts/site-pr/generated-mcp-lint.patch
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Install pinned browser runner
        id: playwright
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: npx --no-install playwright install --with-deps chromium
      - name: Start production preview
        id: preview
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: |
          mkdir -p artifacts/site-pr
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > artifacts/site-pr/preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/site-pr/preview.log
          exit 1
      - name: Commercial pages and mocked form submissions
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: node tests/product-architecture.browser.mjs
      - name: Upload commercial browser evidence immediately
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: commercial-browser-evidence
          path: artifacts/site-pr/product-architecture/
          if-no-files-found: error
          retention-days: 14
      - name: Desktop and mobile browser checks
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: |
          node --check tests/site-pr.browser.mjs
          node tests/site-pr.browser.mjs
      - name: Protected industry diagnostic and PDF regression
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          node --check tests/industry-diagnostic.browser.mjs
          node tests/industry-diagnostic.browser.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-pr-evidence
          path: artifacts/site-pr/
          if-no-files-found: ignore
          retention-days: 14

  commercial-server-mapping:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forms-handler/package-lock.json
      - name: Commercial server mapping with isolated Bpium and notification mocks
        run: |
          npm ci --prefix forms-handler --no-audit --no-fund
          node tests/commercial-handler.mjs
          node tests/forms-handler-regression.mjs

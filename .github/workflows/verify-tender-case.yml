name: Verify tender case branch

on:
  push:
    branches:
      - design/neurotenderolog-compact-case-20261019

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Full production build
        run: npm run build
      - name: Bun
        uses: oven-sh/setup-bun@v2
      - name: Existing case catalog tests
        run: bun test tests/case-studies.test.ts
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Browser verification of built site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tender-vite.log 2>&1 &
          for x in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 2; done
          mkdir -p artifacts
          node --input-type=module <<'BROWSER'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const base = 'http://127.0.0.1:4173';
          const audit = [];
          const assert=(ok,msg)=>{if(!ok)throw Error(msg)};
          for(const [view,w,h] of [['desktop',1440,900],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto(base+'/cases/neurotenderolog',{waitUntil:'domcontentloaded'});
            await page.locator('main h1').waitFor({timeout:20000});
            const title=await page.locator('main h1').innerText();
            assert(title.includes('НейроТендеролог'),'Tender heading absent: '+view);
            const headings=await page.locator('main h2').allInnerTexts();
            for(const label of ['Путь закупки','Три рабочих сценария','Что получает клиент']){
              assert(headings.some(x=>x.includes(label)),view+': section '+label+' absent');
            }
            const imgs=page.locator('main img[src*="/cases/neurotenderolog/"]');
            assert(await imgs.count()===3,view+': expected 3 screenshots, got '+await imgs.count());
            await imgs.evaluateAll(nodes=>nodes.forEach(x=>x.loading='eager'));
            const imageData=await imgs.evaluateAll(async nodes=>{
              await Promise.all(nodes.map(x=>x.decode().catch(()=>null)));
              return nodes.map(x=>({src:x.getAttribute('src'),naturalWidth:x.naturalWidth,naturalHeight:x.naturalHeight,shown:x.getBoundingClientRect().width}));
            });
            assert(imageData.every(x=>x.naturalWidth>0 && x.naturalHeight>0),view+': broken images '+JSON.stringify(imageData));
            const doc=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth,height:document.documentElement.scrollHeight,contact:!!document.getElementById('contact')}));
            assert(doc.scrollWidth<=doc.viewport+2,view+': horizontal overflow '+JSON.stringify(doc));
            assert(doc.contact,view+': missing shared form');
            assert(errors.length===0,view+': JS errors '+JSON.stringify(errors));
            await page.screenshot({path:'artifacts/'+view+'-neurotenderolog.png',fullPage:true,animations:'disabled'});
            const links=page.locator('main a[href$=".webp"]');
            assert(await links.count()>=3,view+': screenshot original links missing');
            const cta=page.locator('main button').filter({hasText:'Обсудить задачу'}).last();
            assert(await cta.count()===1,view+': CTA missing');
            await cta.click();
            await page.waitForTimeout(1000);
            const contactTop=await page.locator('#contact').evaluate(x=>Math.round(x.getBoundingClientRect().top));
            assert(contactTop<h+100 && contactTop>-h,view+': CTA did not scroll to contact: '+contactTop);
            audit.push({view,title,doc,imageData,headings,contactTop,errors});
            await page.close();
          }
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          for(const pathname of ['/','/start','/cases','/cases/caregiver-matching','/cases/business-travel']){
            const response=await page.goto(base+pathname,{waitUntil:'domcontentloaded'});
            assert(response && response.ok(),'Existing route failed '+pathname);
            assert(await page.locator('body').innerText().then(s=>s.length)>150,'Blank route '+pathname);
          }
          await browser.close();
          fs.writeFileSync('artifacts/browser-audit.json',JSON.stringify(audit,null,2));
          console.log('BROWSER_AUDIT='+JSON.stringify(audit.map(x=>({view:x.view,doc:x.doc,images:x.imageData,contactTop:x.contactTop,errors:x.errors}))));
          BROWSER
      - name: Upload browser screenshots and audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurotenderolog-browser-audit
          path: artifacts/
          if-no-files-found: ignore
